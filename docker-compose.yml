name: ${COMPOSE_PROJECT_NAME:-smart-learning}

x-backend-environment: &backend-environment
  APP_NAME: ${APP_NAME:-智能自适应学习系统}
  APP_ENV: ${APP_ENV:-development}
  DEBUG: ${DEBUG:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TZ: ${TIMEZONE:-Asia/Shanghai}
  SECRET_KEY: ${SECRET_KEY:?Copy .env.example to .env and set SECRET_KEY}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-${SECRET_KEY}}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
  ADMIN_NAME: ${ADMIN_NAME:-系统管理员}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-smart_learning}:${POSTGRES_PASSWORD:-smart_learning_dev_password}@postgres:5432/${POSTGRES_DB:-smart_learning}}
  SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-smart_learning}:${POSTGRES_PASSWORD:-smart_learning_dev_password}@postgres:5432/${POSTGRES_DB:-smart_learning}}
  REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-smart_learning_redis_password}@redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:-smart_learning_redis_password}@redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD:-smart_learning_redis_password}@redis:6379/2}
  CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-false}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-smartlearning}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-smart_learning_minio_password}
  MINIO_BUCKET: ${MINIO_BUCKET:-textbooks}
  MINIO_SECURE: ${MINIO_SECURE:-false}
  UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
  OCR_ENABLED: ${OCR_ENABLED:-false}
  PADDLE_OCR_LANG: ${PADDLE_OCR_LANG:-ch}
  PDF_PARSE_PAGE_BATCH_SIZE: ${PDF_PARSE_PAGE_BATCH_SIZE:-20}
  VECTOR_STORE: ${VECTOR_STORE:-chroma}
  CHROMA_PERSIST_DIRECTORY: ${CHROMA_PERSIST_DIRECTORY:-/app/data/chroma}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-large-zh-v1.5}
  RAG_TOP_K: ${RAG_TOP_K:-5}
  RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:-0.45}
  LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_API_URL: ${LLM_API_URL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  QIANFAN_ACCESS_KEY: ${QIANFAN_ACCESS_KEY:-}
  QIANFAN_SECRET_KEY: ${QIANFAN_SECRET_KEY:-}

x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: *backend-environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  volumes:
    - backend_data:/app/data
    - model_cache:/root/.cache/huggingface
  networks:
    - learning-net

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_learning}
      POSTGRES_USER: ${POSTGRES_USER:-smart_learning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_learning_dev_password}
      TZ: ${TIMEZONE:-Asia/Shanghai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - learning-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-smart_learning_redis_password}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-smart_learning_redis_password}
      TZ: ${TIMEZONE:-Asia/Shanghai}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - learning-net

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartlearning}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smart_learning_minio_password}
      TZ: ${TIMEZONE:-Asia/Shanghai}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - learning-net

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartlearning}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smart_learning_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-textbooks}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}" &&
        mc anonymous set none "local/$${MINIO_BUCKET}"
    networks:
      - learning-net

  backend:
    <<: *backend-common
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  worker:
    <<: *backend-common
    command: celery -A app.worker.celery_app worker --loglevel=${LOG_LEVEL:-INFO}
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - learning-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_data:
  model_cache:

networks:
  learning-net:
    driver: bridge
