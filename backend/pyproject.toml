[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-learning-backend"
version = "0.1.0"
description = "FastAPI backend for an intelligent adaptive learning platform"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyJWT>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.9,<1",
  "celery[redis]>=5.4,<6",
  "PyMuPDF>=1.24,<2",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "minio>=7.2,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<6", "ruff>=0.11,<1"]
migration = ["pgdumplib==4.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.setuptools.packages.find]
include = ["app*"]
